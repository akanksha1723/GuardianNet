<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15224A" />
    <meta
      name="description"
      content="GuardianNet — AI-powered community emergency response and safety platform. Get help from verified nearby volunteers in seconds."

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- React Icons render inline as SVG, no extra icon font needed -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
